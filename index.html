<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root {
  --bg:       #0e0e0f;
  --surface:  #18181b;
  --border:   #2a2a2e;
  --fg:       #f0f0f2;
  --muted:    #888891;
  --accent:   #f97316;
  --accent-d: #ea6509;
  color-scheme: dark;
}

/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body {
  font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  overflow-x: hidden;
}

/* ── Header ─────────────────────────────────────────────────── */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: rgba(14,14,15,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 12px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: rgba(14,14,15,.92);
  z-index: 21;
}
.logo {
  font-family: 'Avenir Next Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  font-weight: 900;
  font-size: 1.35rem;
  letter-spacing: .02em;
  text-transform: uppercase;
  flex: 1;
}
.logo span { color: var(--accent) }
.count-badge {
  font-size: .72rem;
  font-weight: 500;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  white-space: nowrap;
}

/* ── Search ─────────────────────────────────────────────────── */
.search-wrap {
  padding: 14px max(16px, env(safe-area-inset-left, 0px));
}
.search-wrap input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--fg);
  font-family: -apple-system, system-ui, sans-serif;
  font-size: .95rem;
  outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--accent) }
.search-wrap input::placeholder { color: var(--muted) }

/* ── Grid ───────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 4px max(16px, env(safe-area-inset-left, 0px)) 32px;
}
@media (max-width: 400px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 8px }
}

/* ── Card ───────────────────────────────────────────────────── */
.card {
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: transform .18s, box-shadow .18s;
  -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(.97) }
.card-cover {
  aspect-ratio: 3/2;
  overflow: hidden;
  background: #111;
  position: relative;
}
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.card-cover { background: linear-gradient(100deg,#18181b 30%,#26262b 50%,#18181b 70%) 0 0/200% 100%; animation: shimmer 1.4s linear infinite }
.card-cover img { opacity: 0; transition: opacity .35s, transform .3s }
.card-cover img.ready { opacity: 1 }
.card-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card:hover .card-cover img { transform: scale(1.04) }
.card-info {
  padding: 10px 11px 12px;
}
.card-name {
  font-family: 'Avenir Next Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  font-weight: 700;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: .03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-sub {
  font-size: .75rem;
  color: var(--muted);
  margin-top: 3px;
}
.card-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 5px;
  vertical-align: middle;
}

/* ── Lightbox ───────────────────────────────────────────────── */
#lb {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.97);
  z-index: 100;
  flex-direction: column;
}
#lb.open { display: flex }
#lb-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}
#lb-title {
  font-family: 'Avenir Next Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#lb-counter {
  font-size: .8rem;
  color: var(--muted);
  flex-shrink: 0;
}
#lb-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: none;
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
#lb-img-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
#lb-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}
.lb-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: none;
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.lb-arrow:active { background: rgba(255,255,255,.22) }
#lb-prev { left: 8px }
#lb-next { right: 8px }
#lb-strip-wrap {
  flex-shrink: 0;
  overflow-x: auto;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: flex;
  gap: 7px;
  scrollbar-width: none;
}
#lb-strip-wrap::-webkit-scrollbar { display: none }
.strip-thumb {
  flex-shrink: 0;
  width: 54px; height: 40px;
  border-radius: 6px;
  overflow: hidden;
  border: 2px solid transparent;
  cursor: pointer;
  opacity: .55;
  transition: opacity .15s, border-color .15s;
}
.strip-thumb img { width: 100%; height: 100%; object-fit: cover }
.strip-thumb.active { border-color: var(--accent); opacity: 1 }
</style>

// ── Build grid ────────────────────────────────────────────────
const grid = document.getElementById('grid');
const keys = Object.keys(DATA);

keys.forEach(folder => {
  const d = DATA[folder];
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.search = (d.label + ' ' + d.sub + ' ' + folder).toLowerCase();
  card.innerHTML = `
    <div class="card-cover">
      <img src="t_${folder.slice(5,7)}_${d.photos[0]}" alt="${d.label}" decoding="async" onload="this.classList.add('ready');this.parentNode.style.animation='none'">
    </div>
    <div class="card-info">
      <div class="card-name">${d.label}</div>
      <div class="card-sub"><span class="card-dot"></span>${d.sub} - ${d.photos.length} photo${d.photos.length > 1 ? 's' : ''}</div>
    </div>`;
  card.addEventListener('click', () => openLb(folder, 0));
  grid.appendChild(card);
});

// ── Search ────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    c.hidden = q && !c.dataset.search.includes(q);
  });
});

// ── Lightbox ──────────────────────────────────────────────────
const lb       = document.getElementById('lb');
const lbImg    = document.getElementById('lb-img');
const lbTitle  = document.getElementById('lb-title');
const lbCount  = document.getElementById('lb-counter');
const lbStrip  = document.getElementById('lb-strip-wrap');

let curFolder = null, curIdx = 0;

function openLb(folder, idx) {
  curFolder = folder;
  curIdx    = idx;
  lbTitle.textContent = DATA[folder].label;

  // Build strip
  lbStrip.innerHTML = '';
  DATA[folder].photos.forEach((p, i) => {
    const t = document.createElement('div');
    t.className = 'strip-thumb' + (i === idx ? ' active' : '');
    t.innerHTML = `<img src="t_${folder.slice(5,7)}_${p}" alt="" loading="lazy">`;
    t.addEventListener('click', () => goTo(i));
    lbStrip.appendChild(t);
  });

  showPhoto(idx);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showPhoto(idx) {
  const photos = DATA[curFolder].photos;
  curIdx = (idx + photos.length) % photos.length;
  const id = curFolder.slice(5,7) + '_' + photos[curIdx];
  lbImg.style.filter = 'blur(6px)';
  lbImg.src = `t_${id}`;
  const big = new Image();
  big.onload = () => { if (lbImg.dataset.cur === id) { lbImg.src = big.src; lbImg.style.filter = '' } };
  lbImg.dataset.cur = id;
  big.src = `m_${id}`;
  [1, -1].forEach(d => { const n = photos[(curIdx + d + photos.length) % photos.length]; new Image().src = `m_${curFolder.slice(5,7)}_${n}` });
  lbCount.textContent = `${curIdx + 1} / ${photos.length}`;

  // Update strip active
  lbStrip.querySelectorAll('.strip-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === curIdx);
  });
  const active = lbStrip.children[curIdx];
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function goTo(idx) { showPhoto(idx) }

document.getElementById('lb-prev').addEventListener('click', () => showPhoto(curIdx - 1));
document.getElementById('lb-next').addEventListener('click', () => showPhoto(curIdx + 1));
document.getElementById('lb-close').addEventListener('click', closeLb);

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbImg.src = '';
}

// Keyboard
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  showPhoto(curIdx - 1);
  if (e.key === 'ArrowRight') showPhoto(curIdx + 1);
  if (e.key === 'Escape')     closeLb();
});

// Touch swipe
let touchStartX = 0;
lb.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX }, { passive: true });
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) showPhoto(curIdx + (dx < 0 ? 1 : -1));
}, { passive: true });
</script>
